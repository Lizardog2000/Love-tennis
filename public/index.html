<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Heart Pong ❤️</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 15px;
}

button {
  padding: 12px 20px;
  margin: 6px;
  border: 0;
  border-radius: 10px;
  background: #ff4f81;
  color: white;
  font-size: 16px;
}

input {
  padding: 12px;
  border-radius: 8px;
  border: 0;
  font-size: 16px;
  width: 220px;
}

#game {
  display: none;
  position: relative;

  width: 800px;
  height: 500px;

  max-width: 100vw;
  margin: auto;

  background: #050505;
  border: 3px solid white;

  overflow: hidden;

  touch-action: none;
}

.paddle {
  position: absolute;

  width: 16px;
  height: 120px;

  background: white;

  border-radius: 10px;
}

#paddle1 {
  left: 15px;
  top: 190px;
}

#paddle2 {
  right: 15px;
  top: 190px;
}

#ball {
  position: absolute;

  width: 28px;
  height: 28px;

  background: #ff4f81;

  transform: rotate(-45deg);

  left: 386px;
  top: 236px;
}

#ball::before,
#ball::after {

  content: "";

  position: absolute;

  width: 28px;
  height: 28px;

  background: #ff4f81;

  border-radius: 50%;
}

#ball::before {
  top: -14px;
  left: 0;
}

#ball::after {
  top: 0;
  left: 14px;
}

#score {
  font-size: 28px;
  margin: 10px;
}

#roomInfo {
  margin: 10px;
}

#result {

  display: none;

  position: absolute;

  inset: 0;

  background: rgba(0,0,0,0.9);

  z-index: 10;

  align-items: center;
  justify-content: center;

  flex-direction: column;
}

#resultText {
  font-size: 30px;
  font-weight: bold;

  padding: 20px;
}

#finalScore {
  font-size: 24px;
}

</style>

</head>

<body>

<h1>❤️ Heart Pong</h1>

<div id="menu">

  <button onclick="createRoom()">
    Создать игру
  </button>

  <br>

  <input
    id="roomInput"
    placeholder="Код комнаты"
  >

  <button onclick="joinRoom()">
    Войти
  </button>

  <p id="status">
    Создай комнату или введи код друга
  </p>

</div>

<div id="roomInfo"></div>

<div id="score">
  0 : 0
</div>


<div id="game">

  <div id="paddle1" class="paddle"></div>

  <div id="paddle2" class="paddle"></div>

  <div id="ball"></div>


  <div id="result">

    <div id="resultText"></div>

    <div id="finalScore"></div>

    <button onclick="rematch()">
      Играть снова ❤️
    </button>

  </div>

</div>


<script>

const socket = new WebSocket(
  location.protocol === "https:"
    ? "wss://" + location.host
    : "ws://" + location.host
);


let myPlayer = null;
let roomId = null;


const menu =
  document.getElementById("menu");

const game =
  document.getElementById("game");

const ball =
  document.getElementById("ball");

const paddle1 =
  document.getElementById("paddle1");

const paddle2 =
  document.getElementById("paddle2");

const score =
  document.getElementById("score");

const status =
  document.getElementById("status");

const roomInfo =
  document.getElementById("roomInfo");

const result =
  document.getElementById("result");

const resultText =
  document.getElementById("resultText");

const finalScore =
  document.getElementById("finalScore");


// ПОДКЛЮЧЕНИЕ
socket.onopen = () => {

  const params =
    new URLSearchParams(location.search);

  const room =
    params.get("room");

  if (room) {

    document.getElementById(
      "roomInput"
    ).value = room;
  }
};


// ПОЛУЧЕНИЕ ДАННЫХ
socket.onmessage = event => {

  const data =
    JSON.parse(event.data);


  // СОЗДАЛИ КОМНАТУ
  if (data.type === "roomCreated") {

    roomId = data.roomId;

    myPlayer = data.player;

    roomInfo.innerText =
      "Код комнаты: " + roomId;

    status.innerText =
      "Отправь код другу ❤️";

    history.replaceState(
      null,
      "",
      "?room=" + roomId
    );

    return;
  }


  // ИГРА НАЧАЛАСЬ
  if (data.type === "start") {

    myPlayer = data.player;

    menu.style.display = "none";

    game.style.display = "block";

    status.innerText =
      "Игра началась!";

    return;
  }


  // ОШИБКА
  if (data.type === "error") {

    status.innerText =
      data.message;

    return;
  }


  // СОСТОЯНИЕ ИГРЫ
  if (data.type === "state") {

    menu.style.display = "none";

    game.style.display = "block";


    ball.style.left =
      (data.ball.x - 14) + "px";

    ball.style.top =
      (data.ball.y - 14) + "px";


    paddle1.style.top =
      (data.players[0] - 60) + "px";

    paddle2.style.top =
      (data.players[1] - 60) + "px";


    score.innerText =
      data.score[0] +
      " : " +
      data.score[1];

    return;
  }


  // КТО-ТО ВЫИГРАЛ
  if (data.type === "gameOver") {

    score.innerText =
      data.score[0] +
      " : " +
      data.score[1];

    finalScore.innerText =
      "Счёт: " +
      data.score[0] +
      " : " +
      data.score[1];


    if (data.winner === myPlayer) {

      resultText.innerText =
        "Поздравляю любимка!";

    } else {

      resultText.innerText =
        "В следующий раз обязательно получится!";

    }


    result.style.display =
      "flex";

    return;
  }


  // НОВАЯ ИГРА
  if (data.type === "restart") {

    result.style.display =
      "none";

    score.innerText =
      "0 : 0";

    return;
  }

};


// СОЗДАТЬ КОМНАТУ
function createRoom() {

  socket.send(
    JSON.stringify({
      type: "create"
    })
  );

}


// ВОЙТИ
function joinRoom() {

  const input =
    document.getElementById(
      "roomInput"
    );

  const code =
    input.value.trim();

  if (!code) return;

  roomId = code;

  socket.send(
    JSON.stringify({
      type: "join",
      roomId: code
    })
  );

}


// НОВАЯ ИГРА
function rematch() {

  socket.send(
    JSON.stringify({
      type: "rematch"
    })
  );

  resultText.innerText =
    "Новая игра...";

}


// УПРАВЛЕНИЕ
function movePaddle(clientY) {

  if (myPlayer === null) return;

  const rect =
    game.getBoundingClientRect();

  let y =
    clientY - rect.top;


  // Учитываем масштаб игры на телефоне
  const scale =
    rect.height / 500;

  y =
    y / scale;


  y = Math.max(
    60,
    Math.min(440, y)
  );


  socket.send(
    JSON.stringify({
      type: "move",
      y: y
    })
  );

}


// ПК
document.addEventListener(
  "mousemove",
  event => {

    if (
      game.style.display !== "none"
    ) {
      movePaddle(event.clientY);
    }

  }
);


// ТЕЛЕФОН
game.addEventListener(
  "touchmove",
  event => {

    event.preventDefault();

    movePaddle(
      event.touches[0].clientY
    );

  },
  { passive: false }
);

</script>

</body>
</html>
