<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Heart Pong ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin: 15px 0;
    }

    #menu {
      margin-top: 30px;
    }

    input {
      padding: 12px;
      font-size: 16px;
      width: 230px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 12px 18px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      background: #ff4f81;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ff2f68;
    }

    #game {
      display: none;
      position: relative;
      width: 800px;
      max-width: 100vw;
      height: 500px;
      margin: auto;
      background: #050505;
      border: 3px solid white;
      overflow: hidden;
    }

    .paddle {
      position: absolute;
      width: 15px;
      height: 120px;
      background: white;
      border-radius: 10px;
    }

    #paddle1 {
      left: 15px;
      top: 190px;
    }

    #paddle2 {
      right: 15px;
      top: 190px;
    }

    #ball {
      position: absolute;
      width: 30px;
      height: 30px;
      background: #ff4f81;
      transform: rotate(-45deg);
      left: 385px;
      top: 235px;
    }

    #ball::before,
    #ball::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      background: #ff4f81;
      border-radius: 50%;
    }

    #ball::before {
      top: -15px;
      left: 0;
    }

    #ball::after {
      left: 15px;
      top: 0;
    }

    #score {
      font-size: 28px;
      margin: 10px;
    }

    #roomInfo {
      margin: 10px;
      font-size: 14px;
    }

    #result {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 10;

      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #resultText {
      font-size: 32px;
      font-weight: bold;
      margin: 20px;
    }

    #finalScore {
      font-size: 24px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <h1>❤️ Heart Pong</h1>

  <div id="menu">

    <button onclick="createRoom()">
      Создать игру
    </button>

    <br>

    <input
      id="roomInput"
      placeholder="Код комнаты"
    >

    <button onclick="joinRoom()">
      Войти
    </button>

    <p id="status">
      Создай комнату или введи код друга
    </p>

  </div>

  <div id="roomInfo"></div>

  <div id="score">
    0 : 0
  </div>

  <div id="game">

    <div id="paddle1" class="paddle"></div>
    <div id="paddle2" class="paddle"></div>

    <div id="ball"></div>

    <div id="result">

      <div id="resultText"></div>

      <div id="finalScore"></div>

      <button onclick="rematch()">
        Играть снова ❤️
      </button>

    </div>

  </div>

  <script>

    const socket = new WebSocket(
      location.protocol === "https:"
        ? "wss://" + location.host
        : "ws://" + location.host
    );

    let myPlayer = null;
    let roomId = null;

    const menu = document.getElementById("menu");
    const game = document.getElementById("game");

    const ball = document.getElementById("ball");

    const paddle1 = document.getElementById("paddle1");
    const paddle2 = document.getElementById("paddle2");

    const scoreElement = document.getElementById("score");

    const statusElement = document.getElementById("status");

    const roomInfo = document.getElementById("roomInfo");

    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const finalScore = document.getElementById("finalScore");


    socket.onopen = () => {

      const params = new URLSearchParams(
        location.search
      );

      const room = params.get("room");

      if (room) {
        document.getElementById("roomInput").value = room;
      }

    };


    socket.onmessage = event => {

      const data = JSON.parse(event.data);


      // Комната создана
      if (data.type === "roomCreated") {

        roomId = data.roomId;
        myPlayer = data.player;

        roomInfo.innerText =
          "Код комнаты: " + roomId;

        statusElement.innerText =
          "Отправь этот код другу ❤️";

        history.replaceState(
          null,
          "",
          "?room=" + roomId
        );

        return;
      }


      // Игра началась
      if (data.type === "start") {

        menu.style.display = "none";
        game.style.display = "block";

        statusElement.innerText =
          "Игра началась!";

        return;
      }


      // Ошибка
      if (data.type === "error") {

        statusElement.innerText =
          data.message;

        return;
      }


      // Состояние игры
      if (data.type === "state") {

        menu.style.display = "none";
        game.style.display = "block";

        const b = data.ball;

        ball.style.left =
          (b.x - 15) + "px";

        ball.style.top =
          (b.y - 15) + "px";


        paddle1.style.top =
          (data.players[0] - 60) + "px";

        paddle2.style.top =
          (data.players[1] - 60) + "px";


        scoreElement.innerText =
          data.score[0] +
          " : " +
          data.score[1];

        return;
      }


      // Конец игры
      if (data.type === "gameOver") {

        scoreElement.innerText =
          data.score[0] +
          " : " +
          data.score[1];

        finalScore.innerText =
          "Счёт: " +
          data.score[0] +
          " : " +
          data.score[1];


        if (data.winner === myPlayer) {

          resultText.innerText =
            "Поздравляю любимка!";

        } else {

          resultText.innerText =
            "В следующий раз обязательно получится!";

        }


        result.style.display =
          "flex";

        return;
      }


      // Новая игра
      if (data.type === "restart") {

        result.style.display =
          "none";

        scoreElement.innerText =
          "0 : 0";

        return;
      }

    };


    function createRoom() {

      socket.send(
        JSON.stringify({
          type: "create"
        })
      );

    }


    function joinRoom() {

      const input =
        document.getElementById("roomInput");

      const code =
        input.value.trim();

      if (!code) return;

      roomId = code;

      socket.send(
        JSON.stringify({
          type: "join",
          roomId: code
        })
      );

    }


    function rematch() {

      socket.send(
        JSON.stringify({
          type: "rematch"
        })
      );

      resultText.innerText =
        "Ждём соперника...";

    }


    // Управление мышкой
    document.addEventListener(
      "mousemove",
      event => {

        if (myPlayer === null) return;

        const rect =
          game.getBoundingClientRect();

        let y =
          event.clientY - rect.top;

        y = Math.max(
          60,
          Math.min(440, y)
        );

        socket.send(
          JSON.stringify({
            type: "move",
            y: y
          })
        );

      }
    );


    // Управление пальцем на телефоне
    game.addEventListener(
      "touchmove",
      event => {

        event.preventDefault();

        if (myPlayer === null) return;

        const rect =
          game.getBoundingClientRect();

        let y =
          event.touches[0].clientY -
          rect.top;

        y = Math.max(
          60,
          Math.min(440, y)
        );

        socket.send(
          JSON.stringify({
            type: "move",
            y: y
          })
        );

      },
      { passive: false }
    );

  </script>

</body>
</html>
