<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Heart Pong</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      max-width: 560px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 32px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      margin: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    input {
      width: 100%;
      max-width: 300px;
      padding: 14px;
      border-radius: 12px;
      border: 0;
      margin: 8px 0;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
    }

    #game {
      display: none;
    }

    #roomInfo {
      margin-bottom: 8px;
      font-size: 17px;
    }

    #score {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #message {
      min-height: 24px;
      margin-bottom: 8px;
      font-size: 16px;
    }

    #field {
      position: relative;
      width: min(92vw, 500px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      background: #181818;
      border: 3px solid white;
      overflow: hidden;
      touch-action: none;
    }

    .paddle {
      position: absolute;
      width: 18px;
      height: 110px;
      background: white;
      border-radius: 9px;
      transform: translateY(-50%);
    }

    #leftPaddle {
      left: 20px;
    }

    #rightPaddle {
      right: 20px;
    }

    #ball {
      position: absolute;
      width: 28px;
      height: 28px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;

      color: #ff4d6d;

      font-size: 30px;
      line-height: 28px;
      font-family: Arial, sans-serif;

      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    #result {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #roomCode {
      font-weight: bold;
      font-size: 24px;
      letter-spacing: 4px;
      margin: 10px;
    }

    .hint {
      opacity: 0.75;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="menu" class="screen">

    <h1>♥ Heart Pong</h1>

    <button id="createBtn">
      Создать игру
    </button>

    <div>
      <input
        id="roomInput"
        maxlength="5"
        placeholder="КОД КОМНАТЫ"
      >
    </div>

    <button id="joinBtn">
      Войти в игру
    </button>

    <div id="menuMessage" class="hint"></div>

  </div>


  <div id="game" class="screen">

    <div id="roomInfo">
      Комната:
      <span id="roomCode"></span>
    </div>

    <div id="score">
      <span id="leftScore">0</span>
      :
      <span id="rightScore">0</span>
    </div>

    <div id="message">
      Ожидание второго игрока...
    </div>

    <div id="field">

      <div
        id="leftPaddle"
        class="paddle"
      ></div>

      <div
        id="rightPaddle"
        class="paddle"
      ></div>

      <div id="ball">♥</div>

      <div id="overlay">

        <div id="result"></div>

        <button id="againBtn">
          Играть ещё
        </button>

      </div>

    </div>

    <div class="hint">
      Двигай ракетку пальцем.<br>
      Когда твоя очередь — нажми на поле для подачи.
    </div>

  </div>


  <script>
    const menu =
      document.getElementById("menu");

    const game =
      document.getElementById("game");

    const createBtn =
      document.getElementById("createBtn");

    const joinBtn =
      document.getElementById("joinBtn");

    const roomInput =
      document.getElementById("roomInput");

    const menuMessage =
      document.getElementById("menuMessage");

    const roomCode =
      document.getElementById("roomCode");

    const leftScore =
      document.getElementById("leftScore");

    const rightScore =
      document.getElementById("rightScore");

    const message =
      document.getElementById("message");

    const field =
      document.getElementById("field");

    const leftPaddle =
      document.getElementById("leftPaddle");

    const rightPaddle =
      document.getElementById("rightPaddle");

    const ball =
      document.getElementById("ball");

    const overlay =
      document.getElementById("overlay");

    const result =
      document.getElementById("result");

    const againBtn =
      document.getElementById("againBtn");


    let socket = null;

    let myPlayer = null;

    let currentRoom = null;

    let latestState = null;

    const FIELD_SIZE = 500;

    function connect() {
      const protocol =
        location.protocol === "https:"
          ? "wss:"
          : "ws:";

      socket = new WebSocket(
        protocol +
        "//" +
        location.host
      );

      socket.onopen = () => {
        menuMessage.textContent =
          "Соединение установлено";
      };

      socket.onmessage = (event) => {
        const data =
          JSON.parse(event.data);

        handleMessage(data);
      };

      socket.onerror = () => {
        menuMessage.textContent =
          "Ошибка соединения";
      };

      socket.onclose = () => {
        message.textContent =
          "Соединение потеряно";
      };
    }

    function handleMessage(data) {

      if (data.type === "room") {
        myPlayer = data.player;
        currentRoom = data.room;

        roomCode.textContent =
          currentRoom;

        menu.style.display = "none";
        game.style.display = "block";

        return;
      }

      if (data.type === "players") {

        if (data.left && data.right) {
          message.textContent =
            "Оба игрока подключены";
        } else {
          message.textContent =
            "Ожидание второго игрока...";
        }

        return;
      }

      if (data.type === "state") {
        latestState = data;
        draw(data);
        return;
      }

      if (data.type === "gameOver") {

        overlay.style.display =
          "flex";

        if (
          data.winner === myPlayer
        ) {
          result.textContent =
            "Поздравляю любимка 💋!";
        } else {
          result.textContent =
            "В следующий раз обязательно получится!";
        }

        return;
      }

      if (data.type === "error") {
        menuMessage.textContent =
          data.message;
      }
    }

    function draw(data) {

      leftScore.textContent =
        data.leftScore;

      rightScore.textContent =
        data.rightScore;

      const size =
        field.clientWidth;

      const scale =
        size / FIELD_SIZE;

      leftPaddle.style.top =
        data.leftY * scale + "px";

      rightPaddle.style.top =
        data.rightY * scale + "px";

      ball.style.left =
        data.ball.x * scale + "px";

      ball.style.top =
        data.ball.y * scale + "px";

      ball.style.width =
        28 * scale + "px";

      ball.style.height =
        28 * scale + "px";

      ball.style.fontSize =
        30 * scale + "px";

      ball.style.lineHeight =
        28 * scale + "px";


      if (!data.moving) {

        if (
          data.server === myPlayer
        ) {
          message.textContent =
            "Твоя подача — нажми на поле";
        } else {
          message.textContent =
            "Подача соперника";
        }

      } else {
        message.textContent =
          "Игра идёт";
      }
    }

    function sendMove(clientY) {

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      const rect =
        field.getBoundingClientRect();

      const y =
        (clientY - rect.top) /
        rect.height *
        FIELD_SIZE;

      const min = 55;
      const max = FIELD_SIZE - 55;

      const clamped =
        Math.max(
          min,
          Math.min(max, y)
        );

      socket.send(
        JSON.stringify({
          type: "move",
          y: clamped
        })
      );
    }


    function sendServe() {

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "serve"
        })
      );
    }


    createBtn.addEventListener(
      "click",
      () => {

        if (!socket) {
          connect();

          setTimeout(() => {
            createRoom();
          }, 300);

          return;
        }

        createRoom();
      }
    );


    function createRoom() {

      if (
        socket.readyState !==
        WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "create"
        })
      );
    }


    joinBtn.addEventListener(
      "click",
      () => {

        const code =
          roomInput.value
            .trim()
            .toUpperCase();

        if (code.length !== 5) {
          menuMessage.textContent =
            "Введите код из 5 символов";

          return;
        }

        if (!socket) {
          connect();

          setTimeout(() => {
            joinRoom(code);
          }, 300);

          return;
        }

        joinRoom(code);
      }
    );


    function joinRoom(code) {

      if (
        socket.readyState !==
        WebSocket.OPEN
      ) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "join",
          room: code
        })
      );
    }


    field.addEventListener(
      "pointerdown",
      (event) => {

        event.preventDefault();

        sendMove(event.clientY);

        if (
          latestState &&
          latestState.server === myPlayer &&
          !latestState.moving &&
          !latestState.gameOver
        ) {
          sendServe();
        }
      }
    );


    field.addEventListener(
      "pointermove",
      (event) => {

        if (
          event.buttons === 0 &&
          event.pointerType !== "touch"
        ) {
          return;
        }

        event.preventDefault();

        sendMove(event.clientY);
      }
    );


    field.addEventListener(
      "pointerup",
      (event) => {
        event.preventDefault();
      }
    );


    againBtn.addEventListener(
      "click",
      () => {

        overlay.style.display =
          "none";

        if (
          socket &&
          socket.readyState ===
          WebSocket.OPEN
        ) {
          socket.send(
            JSON.stringify({
              type: "rematch"
            })
          );
        }
      }
    );


    window.addEventListener(
      "resize",
      () => {

        if (latestState) {
          draw(latestState);
        }

      }
    );


    connect();
  </script>

</body>
</html>
