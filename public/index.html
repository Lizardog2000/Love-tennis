<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Любовный Pong</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #111;

      color: white;

      font-family:
        Arial,
        sans-serif;

      overflow: hidden;

      touch-action: none;
    }


    body {

      display: flex;

      justify-content: center;
      align-items: center;
    }


    /* ==================================================
       МЕНЮ
       ================================================== */

    #menu {

      width: 90%;

      max-width: 380px;

      text-align: center;
    }


    #menu h1 {

      margin: 0 0 25px;

      font-size: 30px;
    }


    input,
    button {

      width: 100%;

      height: 50px;

      margin-top: 12px;

      border: 0;

      border-radius: 12px;

      font-size: 18px;
    }


    input {

      padding: 0 15px;

      text-align: center;
    }


    button {

      background: white;

      color: #111;

      font-weight: bold;

      cursor: pointer;
    }


    /* ==================================================
       ЭКРАН ИГРЫ
       ================================================== */

    #gameScreen {

      display: none;

      width: 100%;

      height: 100vh;

      flex-direction: column;

      justify-content: center;

      align-items: center;
    }


    /* ==================================================
       ВЕРХНЯЯ ПАНЕЛЬ
       ================================================== */

    #top {

      width: min(92vw, 500px);

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 10px;
    }


    #score {

      font-size: 30px;

      font-weight: bold;

      min-width: 80px;
    }


    #serveInfo {

      font-size: 14px;

      text-align: center;

      opacity: 0.8;
    }


    #roomText {

      font-size: 13px;

      opacity: 0.7;

      min-width: 80px;

      text-align: right;
    }


    /* ==================================================
       ПОЛЕ 500 x 500
       ================================================== */

    #game {

      position: relative;

      /*
        Внутреннее игровое поле
        всегда имеет одинаковую ширину
        и высоту.

        На телефоне оно просто
        уменьшается целиком.
      */

      width: min(92vw, 500px);

      aspect-ratio: 1 / 1;

      background: #050505;

      border: 2px solid white;

      border-radius: 8px;

      overflow: hidden;

      touch-action: none;
    }


    /* ==================================================
       РАКЕТКИ
       ================================================== */

    .paddle {

      position: absolute;

      width: 18px;

      height: 120px;

      background: white;

      border-radius: 9px;

      z-index: 5;
    }


    #paddle1 {

      left: 20px;

      top: 190px;
    }


    #paddle2 {

      right: 20px;

      top: 190px;
    }


    /* ==================================================
       СЕРДЕЧКО
       ================================================== */

    #ball {

      position: absolute;

      width: 28px;

      height: 28px;

      /*
        Никакого сложного CSS-сердца.

        Обычный символ ♥ всегда
        выглядит ровно.
      */

      color: #ff4d6d;

      font-size: 30px;

      line-height: 28px;

      text-align: center;

      font-family:
        Arial,
        sans-serif;

      z-index: 10;

      user-select: none;

      pointer-events: none;
    }


    /* ==================================================
       ОКНО РЕЗУЛЬТАТА
       ================================================== */

    #message {

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      text-align: center;

      padding: 25px;

      background:
        rgba(0, 0, 0, 0.88);

      z-index: 100;
    }


    #messageText {

      font-size: 27px;

      line-height: 1.3;

      margin-bottom: 20px;
    }


    #restart {

      width: 220px;
    }

  </style>

</head>


<body>


  <!-- ==================================================
       МЕНЮ
       ================================================== -->

  <div id="menu">

    <h1>
      💕 Любовный Pong 💕
    </h1>


    <button id="createBtn">
      Создать игру
    </button>


    <input
      id="roomInput"
      type="text"
      placeholder="Код комнаты"
      autocomplete="off"
    >


    <button id="joinBtn">
      Войти в игру
    </button>

  </div>


  <!-- ==================================================
       ИГРА
       ================================================== -->

  <div id="gameScreen">


    <div id="top">

      <div id="score">
        0 : 0
      </div>


      <div id="serveInfo">
        Подача
      </div>


      <div id="roomText">
        —
      </div>

    </div>


    <div id="game">


      <div
        id="paddle1"
        class="paddle"
      ></div>


      <div
        id="paddle2"
        class="paddle"
      ></div>


      <!-- РОВНОЕ СЕРДЕЧКО -->

      <div id="ball">
        ♥
      </div>


      <!-- РЕЗУЛЬТАТ -->

      <div id="message">

        <div id="messageText"></div>

        <button id="restart">
          Играть снова
        </button>

      </div>


    </div>

  </div>


  <script>

    // ==================================================
    // ЭЛЕМЕНТЫ
    // ==================================================

    const menu =
      document.getElementById("menu");

    const gameScreen =
      document.getElementById("gameScreen");

    const createBtn =
      document.getElementById("createBtn");

    const joinBtn =
      document.getElementById("joinBtn");

    const roomInput =
      document.getElementById("roomInput");

    const score =
      document.getElementById("score");

    const serveInfo =
      document.getElementById("serveInfo");

    const roomText =
      document.getElementById("roomText");

    const game =
      document.getElementById("game");

    const paddle1 =
      document.getElementById("paddle1");

    const paddle2 =
      document.getElementById("paddle2");

    const ball =
      document.getElementById("ball");

    const message =
      document.getElementById("message");

    const messageText =
      document.getElementById("messageText");

    const restart =
      document.getElementById("restart");


    // ==================================================
    // СОЕДИНЕНИЕ
    // ==================================================

    let ws = null;

    let myPlayer = null;

    let roomId = null;


    // Серверное поле — 500 x 500

    const FIELD_SIZE = 500;

    const PADDLE_HEIGHT = 120;

    const PADDLE_WIDTH = 18;

    const PADDLE_MARGIN = 20;

    const BALL_RADIUS = 14;


    // ==================================================
    // ПОДКЛЮЧЕНИЕ
    // ==================================================

    function connect() {

      const protocol =
        location.protocol === "https:"
          ? "wss:"
          : "ws:";


      ws =
        new WebSocket(
          protocol +
          "//" +
          location.host
        );


      ws.onopen = () => {

        console.log(
          "WebSocket подключён"
        );
      };


      ws.onmessage = event => {

        const data =
          JSON.parse(
            event.data
          );


        // ----------------------------------------------
        // СОЗДАЛИ
        // ----------------------------------------------

        if (
          data.type === "created"
        ) {

          roomId =
            data.room;

          myPlayer =
            data.player;


          roomText.textContent =
            "Комната: " +
            roomId;


          showGame();

          return;
        }


        // ----------------------------------------------
        // ПОДКЛЮЧИЛИСЬ
        // ----------------------------------------------

        if (
          data.type === "joined"
        ) {

          roomId =
            data.room;

          myPlayer =
            data.player;


          roomText.textContent =
            "Комната: " +
            roomId;


          showGame();

          return;
        }


        // ----------------------------------------------
        // ОШИБКА
        // ----------------------------------------------

        if (
          data.type === "error"
        ) {

          alert(
            data.message
          );

          return;
        }


        // ----------------------------------------------
        // ИГРА
        // ----------------------------------------------

        if (
          data.type === "state"
        ) {

          updateGame(data);

          return;
        }


        // ----------------------------------------------
        // КОНЕЦ ИГРЫ
        // ----------------------------------------------

        if (
          data.type === "gameOver"
        ) {

          message.style.display =
            "flex";


          if (
            data.winner === myPlayer
          ) {

            messageText.textContent =
              "Поздравляю любимка 💋!";

          } else {

            messageText.textContent =
              "В следующий раз обязательно получится!";
          }


          return;
        }

      };


      ws.onclose = () => {

        console.log(
          "WebSocket отключён"
        );

      };

    }


    // ==================================================
    // ПОКАЗАТЬ ИГРУ
    // ==================================================

    function showGame() {

      menu.style.display =
        "none";

      gameScreen.style.display =
        "flex";
    }


    // ==================================================
    // ОБНОВЛЕНИЕ ИГРЫ
    // ==================================================

    function updateGame(data) {

      // ----------------------------------------------
      // СЧЁТ
      // ----------------------------------------------

      score.textContent =
        data.score[0] +
        " : " +
        data.score[1];


      // ----------------------------------------------
      // РАЗМЕР ФИЗИЧЕСКОГО ПОЛЯ
      // ----------------------------------------------

      const rect =
        game.getBoundingClientRect();


      /*
        Сервер тоже работает 500 x 500.

        Поэтому X и Y масштабируются
        одинаково.

        Никакого растягивания.
      */

      const scale =
        rect.width /
        FIELD_SIZE;


      // ----------------------------------------------
      // ЛЕВАЯ РАКЕТКА
      // ----------------------------------------------

      let leftTop =
        data.players[0] *
        scale -
        (PADDLE_HEIGHT * scale) / 2;


      leftTop =
        Math.max(
          0,
          Math.min(
            rect.height -
              PADDLE_HEIGHT * scale,
            leftTop
          )
        );


      paddle1.style.top =
        leftTop + "px";


      // ----------------------------------------------
      // ПРАВАЯ РАКЕТКА
      // ----------------------------------------------

      let rightTop =
        data.players[1] *
        scale -
        (PADDLE_HEIGHT * scale) / 2;


      /*
        Даже если телефон
        что-то передал неправильно,
        ракетка всё равно
        не выйдет за поле.
      */

      rightTop =
        Math.max(
          0,
          Math.min(
            rect.height -
              PADDLE_HEIGHT * scale,
            rightTop
          )
        );


      paddle2.style.top =
        rightTop + "px";


      // ----------------------------------------------
      // СЕРДЕЧКО
      // ----------------------------------------------

      const heartX =
        data.ball.x *
        scale;


      const heartY =
        data.ball.y *
        scale;


      ball.style.left =
        (
          heartX -
          BALL_RADIUS * scale
        ) + "px";


      ball.style.top =
        (
          heartY -
          BALL_RADIUS * scale
        ) + "px";


      ball.style.fontSize =
        (
          30 * scale
        ) + "px";


      ball.style.lineHeight =
        (
          28 * scale
        ) + "px";


      // ----------------------------------------------
      // ТЕКСТ ПОДАЧИ
      // ----------------------------------------------

      if (
        data.ballMoving
      ) {

        serveInfo.textContent =
          "Играем";

      } else if (
        data.servingPlayer ===
        myPlayer
      ) {

        serveInfo.textContent =
          "Твоя подача";

      } else {

        serveInfo.textContent =
          "Подача соперника";
      }

    }


    // ==================================================
    // СОЗДАТЬ ИГРУ
    // ==================================================

    createBtn.addEventListener(
      "click",
      () => {

        connect();


        const timer =
          setInterval(
            () => {

              if (
                ws &&
                ws.readyState ===
                WebSocket.OPEN
              ) {

                clearInterval(timer);


                ws.send(
                  JSON.stringify({
                    type: "create"
                  })
                );

              }

            },
            50
          );

      }
    );


    // ==================================================
    // ВОЙТИ В ИГРУ
    // ==================================================

    joinBtn.addEventListener(
      "click",
      () => {

        const code =
          roomInput.value
            .trim()
            .toUpperCase();


        if (!code) {

          alert(
            "Введите код комнаты"
          );

          return;
        }


        connect();


        const timer =
          setInterval(
            () => {

              if (
                ws &&
                ws.readyState ===
                WebSocket.OPEN
              ) {

                clearInterval(timer);


                ws.send(
                  JSON.stringify({

                    type: "join",

                    room: code
                  })
                );

              }

            },
            50
          );

      }
    );


    // ==================================================
    // ДВИЖЕНИЕ РАКЕТКИ
    // ==================================================

    function movePaddle(clientY) {

      if (
        !ws ||
        ws.readyState !==
        WebSocket.OPEN
      ) {
        return;
      }


      const rect =
        game.getBoundingClientRect();


      /*
        Переводим положение пальца
        в координаты 500 x 500.
      */

      let y =
        (
          clientY -
          rect.top
        ) /
        rect.height *
        FIELD_SIZE;


      /*
        Центр ракетки:
        60 ... 440
      */

      const minY =
        PADDLE_HEIGHT / 2;


      const maxY =
        FIELD_SIZE -
        PADDLE_HEIGHT / 2;


      y =
        Math.max(
          minY,
          Math.min(
            maxY,
            y
          )
        );


      ws.send(
        JSON.stringify({

          type: "move",

          y

        })
      );

    }


    // ==================================================
    // ПАЛЕЦ
    // ==================================================

    game.addEventListener(
      "touchstart",
      event => {

        event.preventDefault();


        if (
          event.touches.length === 0
        ) {
          return;
        }


        const y =
          event.touches[0].clientY;


        movePaddle(y);


        /*
          Одно касание одновременно
          позволяет сделать подачу,
          если это твоя очередь.
        */

        if (
          ws &&
          ws.readyState ===
          WebSocket.OPEN
        ) {

          ws.send(
            JSON.stringify({
              type: "serve"
            })
          );
        }

      },
      {
        passive: false
      }
    );


    // ==================================================
    // ДВИЖЕНИЕ ПАЛЬЦЕМ
    // ==================================================

    game.addEventListener(
      "touchmove",
      event => {

        event.preventDefault();


        if (
          event.touches.length === 0
        ) {
          return;
        }


        movePaddle(
          event.touches[0].clientY
        );

      },
      {
        passive: false
      }
    );


    // ==================================================
    // МЫШКА
    // ==================================================

    game.addEventListener(
      "mousemove",
      event => {

        movePaddle(
          event.clientY
        );

      }
    );


    // ==================================================
    // КЛИК — ПОДАЧА
    // ==================================================

    game.addEventListener(
      "click",
      () => {

        if (
          ws &&
          ws.readyState ===
          WebSocket.OPEN
        ) {

          ws.send(
            JSON.stringify({
              type: "serve"
            })
          );
        }

      }
    );


    // ==================================================
    // ИГРАТЬ СНОВА
    // ==================================================

    restart.addEventListener(
      "click",
      () => {

        message.style.display =
          "none";


        if (
          ws &&
          ws.readyState ===
          WebSocket.OPEN
        ) {

          ws.send(
            JSON.stringify({
              type: "rematch"
            })
          );

        }

      }
    );

  </script>

</body>

</html>
