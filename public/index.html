<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Любовный Pong</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #menu {
      width: 92%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    button,
    input {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
    }

    button {
      background: white;
      color: black;
      font-weight: bold;
    }

    input {
      padding: 0 15px;
      text-align: center;
    }

    #gameScreen {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #top {
      width: min(96vw, 500px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    #score {
      font-size: 30px;
    }

    #serveInfo {
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }

    /*
      КВАДРАТНОЕ ПОЛЕ
    */
    #game {
      position: relative;

      width: min(96vw, 500px);
      height: min(96vw, 500px);

      max-width: 500px;
      max-height: 500px;

      background: #050505;

      border: 2px solid white;
      border-radius: 8px;

      overflow: hidden;

      touch-action: none;
    }

    /*
      Левая ракетка
    */
    .paddle {
      position: absolute;

      width: 18px;
      height: 120px;

      top: 190px;

      background: white;

      border-radius: 9px;

      z-index: 5;
    }

    #paddle1 {
      left: 20px;
    }

    /*
      Правая ракетка
    */
    #paddle2 {
      right: 20px;
    }

    /*
      Сердечко
    */
    #ball {
      position: absolute;

      width: 28px;
      height: 28px;

      z-index: 10;

      transform: rotate(-45deg);

      background: #ff4d6d;

      border-radius: 50% 0 50% 50%;
    }

    #ball::before,
    #ball::after {
      content: "";

      position: absolute;

      width: 28px;
      height: 28px;

      background: #ff4d6d;

      border-radius: 50%;
    }

    #ball::before {
      top: -14px;
      left: 0;
    }

    #ball::after {
      top: 0;
      left: 14px;
    }

    #message {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      display: none;

      background: rgba(0, 0, 0, 0.85);

      align-items: center;
      justify-content: center;

      flex-direction: column;

      text-align: center;

      padding: 25px;

      z-index: 50;
    }

    #messageText {
      font-size: 28px;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    #restart {
      width: 220px;
    }

    #roomText {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <!-- МЕНЮ -->

  <div id="menu">

    <h1>💕 Любовный Pong 💕</h1>

    <button id="createBtn">
      Создать игру
    </button>

    <input
      id="roomInput"
      placeholder="Код комнаты"
      autocomplete="off"
    >

    <button id="joinBtn">
      Войти в игру
    </button>

  </div>


  <!-- ИГРА -->

  <div id="gameScreen">

    <div id="top">

      <div id="score">
        0 : 0
      </div>

      <div id="serveInfo">
        Подача
      </div>

      <div id="roomText">
        —
      </div>

    </div>


    <div id="game">

      <div
        id="paddle1"
        class="paddle"
      ></div>

      <div
        id="paddle2"
        class="paddle"
      ></div>

      <div id="ball"></div>


      <div id="message">

        <div id="messageText"></div>

        <button id="restart">
          Играть снова
        </button>

      </div>

    </div>

  </div>


  <script>

    const menu =
      document.getElementById("menu");

    const gameScreen =
      document.getElementById("gameScreen");

    const createBtn =
      document.getElementById("createBtn");

    const joinBtn =
      document.getElementById("joinBtn");

    const roomInput =
      document.getElementById("roomInput");

    const roomText =
      document.getElementById("roomText");

    const score =
      document.getElementById("score");

    const serveInfo =
      document.getElementById("serveInfo");

    const game =
      document.getElementById("game");

    const paddle1 =
      document.getElementById("paddle1");

    const paddle2 =
      document.getElementById("paddle2");

    const ball =
      document.getElementById("ball");

    const message =
      document.getElementById("message");

    const messageText =
      document.getElementById("messageText");

    const restart =
      document.getElementById("restart");


    let ws = null;

    let myPlayer = null;

    let roomId = null;


    /*
      Реальные размеры игровой физики сервера
    */
    const SERVER_WIDTH = 800;
    const SERVER_HEIGHT = 500;

    const PADDLE_HEIGHT = 120;

    const PADDLE_MARGIN = 20;

    const PADDLE_WIDTH = 18;

    const BALL_RADIUS = 14;


    function connect() {

      const protocol =
        location.protocol === "https:"
          ? "wss:"
          : "ws:";

      ws = new WebSocket(
        protocol +
        "//" +
        location.host
      );


      ws.onopen = () => {
        console.log("WebSocket connected");
      };


      ws.onmessage = (event) => {

        const data =
          JSON.parse(event.data);


        /*
          Создали комнату
        */

        if (data.type === "created") {

          roomId = data.room;
          myPlayer = data.player;

          roomText.textContent =
            "Комната: " + roomId;

          showGame();

          return;
        }


        /*
          Вошли в комнату
        */

        if (data.type === "joined") {

          roomId = data.room;
          myPlayer = data.player;

          roomText.textContent =
            "Комната: " + roomId;

          showGame();

          return;
        }


        /*
          Ошибка
        */

        if (data.type === "error") {

          alert(data.message);

          return;
        }


        /*
          Состояние игры
        */

        if (data.type === "state") {

          updateGame(data);

          return;
        }


        /*
          Конец игры
        */

        if (data.type === "gameOver") {

          message.style.display =
            "flex";

          if (data.winner === myPlayer) {

            messageText.textContent =
              "Поздравляю любимка! 💕";

          } else {

            messageText.textContent =
              "В следующий раз обязательно получится! 💕";

          }

          return;
        }

      };


      ws.onclose = () => {

        console.log(
          "WebSocket disconnected"
        );

      };

    }


    function showGame() {

      menu.style.display =
        "none";

      gameScreen.style.display =
        "flex";

    }


    /*
      Перевод серверных координат
      в квадратное визуальное поле.
    */

    function updateGame(data) {

      /*
        ВАЖНО:

        Мы берём реальные размеры
        квадратного поля.

        Сервер всё ещё использует
        координаты 800 x 500.
      */

      const rect =
        game.getBoundingClientRect();


      const scaleX =
        rect.width / SERVER_WIDTH;

      const scaleY =
        rect.height / SERVER_HEIGHT;


      /*
        Счёт
      */

      score.textContent =
        data.score[0] +
        " : " +
        data.score[1];


      /*
        Левая ракетка

        Центр ракетки находится
        в data.players[0].
      */

      const leftY =
        data.players[0] *
        scaleY;

      paddle1.style.top =
        (leftY -
        PADDLE_HEIGHT * scaleY / 2) +
        "px";


      /*
        Правая ракетка

        Центр ракетки находится
        в data.players[1].

        Ограничение здесь тоже есть,
        поэтому она не сможет
        уйти за нижнюю границу.
      */

      const rightY =
        data.players[1] *
        scaleY;

      const paddleVisualHeight =
        PADDLE_HEIGHT * scaleY;


      let rightTop =
        rightY -
        paddleVisualHeight / 2;


      /*
        Дополнительная защита
        на клиенте.
      */

      rightTop =
        Math.max(
          0,
          Math.min(
            rect.height -
            paddleVisualHeight,
            rightTop
          )
        );


      paddle2.style.top =
        rightTop + "px";


      /*
        Мяч
      */

      const ballX =
        data.ball.x *
        scaleX;

      const ballY =
        data.ball.y *
        scaleY;


      ball.style.left =
        (ballX -
        BALL_RADIUS * scaleX) +
        "px";


      ball.style.top =
        (ballY -
        BALL_RADIUS * scaleY) +
        "px";


      /*
        Информация о подаче
      */

      if (data.servingPlayer === myPlayer) {

        if (data.ballMoving) {

          serveInfo.textContent =
            "Играем";

        } else {

          serveInfo.textContent =
            "Твоя подача — нажми на поле";

        }

      } else {

        if (data.ballMoving) {

          serveInfo.textContent =
            "Играем";

        } else {

          serveInfo.textContent =
            "Подача соперника";

        }

      }

    }


    /*
      Создать комнату
    */

    createBtn.addEventListener(
      "click",
      () => {

        connect();

        const wait =
          setInterval(() => {

            if (
              ws &&
              ws.readyState === WebSocket.OPEN
            ) {

              clearInterval(wait);

              ws.send(
                JSON.stringify({
                  type: "create"
                })
              );

            }

          }, 50);

      }
    );


    /*
      Войти в комнату
    */

    joinBtn.addEventListener(
      "click",
      () => {

        const code =
          roomInput.value
            .trim()
            .toUpperCase();

        if (!code) {

          alert(
            "Введите код комнаты"
          );

          return;
        }


        connect();


        const wait =
          setInterval(() => {

            if (
              ws &&
              ws.readyState === WebSocket.OPEN
            ) {

              clearInterval(wait);

              ws.send(
                JSON.stringify({
                  type: "join",
                  room: code
                })
              );

            }

          }, 50);

      }
    );


    /*
      Отправка положения ракетки
    */

    function movePaddle(clientY) {

      if (
        !ws ||
        ws.readyState !== WebSocket.OPEN
      ) {
        return;
      }


      const rect =
        game.getBoundingClientRect();


      let y =
        (clientY - rect.top) /
        rect.height *
        SERVER_HEIGHT;


      /*
        Очень важное ограничение:

        центр ракетки не может быть
        выше 60 или ниже 440.

        Поэтому вся ракетка
        всегда остаётся внутри поля.
      */

      const minY =
        PADDLE_HEIGHT / 2;

      const maxY =
        SERVER_HEIGHT -
        PADDLE_HEIGHT / 2;


      y =
        Math.max(
          minY,
          Math.min(maxY, y)
        );


      ws.send(
        JSON.stringify({
          type: "move",
          y: y
        })
      );

    }


    /*
      Touch — телефон
    */

    game.addEventListener(
      "touchmove",
      (event) => {

        event.preventDefault();

        if (!event.touches.length) {
          return;
        }

        movePaddle(
          event.touches[0].clientY
        );

      },
      {
        passive: false
      }
    );


    /*
      Первое касание:
      двигаем ракетку и одновременно
      пытаемся сделать подачу.
    */

    game.addEventListener(
      "touchstart",
      (event) => {

        event.preventDefault();

        if (!event.touches.length) {
          return;
        }


        const clientY =
          event.touches[0].clientY;


        movePaddle(clientY);


        if (
          ws &&
          ws.readyState === WebSocket.OPEN
        ) {

          ws.send(
            JSON.stringify({
              type: "serve"
            })
          );

        }

      },
      {
        passive: false
      }
    );


    /*
      Компьютер / мышка
    */

    game.addEventListener(
      "mousemove",
      (event) => {

        movePaddle(
          event.clientY
        );

      }
    );


    /*
      Клик — подача
    */

    game.addEventListener(
      "click",
      () => {

        if (
          ws &&
          ws.readyState === WebSocket.OPEN
        ) {

          ws.send(
            JSON.stringify({
              type: "serve"
            })
          );

        }

      }
    );


    /*
      Играть снова
    */

    restart.addEventListener(
      "click",
      () => {

        message.style.display =
          "none";


        if (
          ws &&
          ws.readyState === WebSocket.OPEN
        ) {

          ws.send(
            JSON.stringify({
              type: "rematch"
            })
          );

        }

      }
    );

  </script>

</body>
</html>
